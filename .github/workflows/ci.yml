name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The newest Go: go.mod's go line is only the minimum.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make lint test build
